<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcript | GradePoint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        :root {
            --ink: #0d1117;
            --paper: #faf9f7;
            --parchment: #f5f3ef;
            --crimson: #8b1538;
            --crimson-light: #a5294d;
            --gold: #c9a227;
            --gold-light: #e4bc3a;
            --slate: #475569;
            --slate-light: #64748b;
            --mist: #e2e8f0;
            --mist-dark: #cbd5e1;
            --white: #ffffff;
            --shadow-soft: 0 4px 24px rgba(13, 17, 23, 0.08);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--paper);
            color: var(--ink);
            line-height: 1.6;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(139, 21, 56, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(201, 162, 39, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        h1, h2, h3, h4 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Hero */
        .hero {
            padding: 2rem 0;
            text-align: center;
        }

        .hero h2 {
            font-size: 2rem;
            color: var(--ink);
        }

        /* Document Header */
        .doc-header {
            text-align: center;
            padding: 2rem 0 1.5rem;
            border-bottom: 3px solid var(--crimson);
            margin-bottom: 2rem;
            position: relative;
        }

        .doc-header::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: var(--gold);
        }

        .doc-badge {
            font-size: 0.6875rem;
            font-weight: 600;
            color: var(--white);
            background: var(--crimson);
            padding: 0.25rem 0.75rem;
            border-radius: 2px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: inline-block;
            margin-bottom: 0.75rem;
        }

        .doc-title {
            font-size: 2rem;
            color: var(--crimson);
            margin-bottom: 0.5rem;
        }

        .doc-meta {
            display: flex;
            justify-content: center;
            gap: 2rem;
            font-size: 0.8125rem;
            color: var(--slate-light);
        }

        .doc-meta span {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        /* Student Info */
        .student-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            padding: 1.25rem 1.5rem;
            background: var(--parchment);
            border: 1px solid var(--mist);
            border-radius: 10px;
            margin-bottom: 2rem;
        }

        @media (max-width: 600px) {
            .student-card { grid-template-columns: 1fr; }
        }

        .student-field label {
            display: block;
            font-size: 0.6875rem;
            font-weight: 600;
            color: var(--slate-light);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.25rem;
        }

        .student-field .value {
            font-size: 1rem;
            font-weight: 500;
            color: var(--ink);
        }

        /* Select */
        .select-wrap {
            max-width: 300px;
            margin: 0 auto 2rem;
        }

        .form-select {
            width: 100%;
            padding: 0.875rem 1rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9375rem;
            color: var(--ink);
            background: var(--white);
            border: 1px solid var(--mist);
            border-radius: 8px;
            cursor: pointer;
        }

        .form-select:focus {
            outline: none;
            border-color: var(--crimson);
        }

        /* Results */
        .semester-group {
            margin-bottom: 2rem;
        }

        .semester-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.25rem;
            background: var(--crimson);
            color: white;
            border-radius: 10px 10px 0 0;
        }

        .semester-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.125rem;
            font-weight: 600;
        }

        .semester-gpa {
            font-weight: 600;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--white);
            border: 1px solid var(--mist);
            border-top: none;
            border-radius: 0 0 10px 10px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .results-table th,
        .results-table td {
            padding: 0.875rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--mist);
        }

        .results-table th {
            font-size: 0.6875rem;
            font-weight: 600;
            color: var(--slate-light);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: var(--parchment);
        }

        .results-table .code {
            font-family: monospace;
            font-weight: 600;
            color: var(--crimson);
        }

        .results-table .grade-badge {
            display: inline-block;
            padding: 0.125rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            min-width: 28px;
            text-align: center;
        }

        .results-table .grade-badge.O { background: #fef3c7; color: #b45309; }
        .results-table .grade-badge\.A\+ { background: #ede9fe; color: #6d28d9; }
        .results-table .grade-badge.A { background: #ddd6fe; color: #7c3aed; }
        .results-table .grade-badge\.B\+ { background: #cffafe; color: #0891b2; }
        .results-table .grade-badge.B { background: #fce7f3; color: #db2777; }
        .results-table .grade-badge.C { background: #d1fae5; color: #059669; }
        .results-table .grade-badge.F { background: #fee2e2; color: #dc2626; }

        .results-table .credits,
        .results-table .points {
            text-align: center;
        }

        /* Summary */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            padding: 1.5rem;
            background: var(--parchment);
            border: 1px solid var(--mist);
            border-radius: 10px;
            margin-top: 2rem;
        }

        @media (max-width: 500px) {
            .summary-grid { grid-template-columns: 1fr; }
        }

        .summary-item {
            text-align: center;
        }

        .summary-label {
            font-size: 0.6875rem;
            color: var(--slate-light);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.25rem;
        }

        .summary-value {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--crimson);
        }

        /* Actions */
        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            font-size: 0.875rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .btn-primary {
            background: var(--crimson);
            color: white;
        }

        .btn-secondary {
            background: var(--white);
            color: var(--ink);
            border: 1px solid var(--mist);
        }

        /* Print */
        @media print {
            .nav-header, .select-wrap, .actions, .footer { display: none; }
            body { background: white; }
            .results-table { page-break-inside: avoid; }
        }

        /* Footer */
        .footer {
            padding: 2rem 0;
            margin-top: 3rem;
            border-top: 1px solid var(--mist);
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="nav-header">
        <div class="container">
            <div class="nav-inner">
                <a href="/" class="nav-logo">
                    <div class="nav-logo-icon">🎓</div>
                    <div class="nav-logo-text">
                        <h1>GradePoint</h1>
                        <span>Academic Tracker</span>
                    </div>
                </a>
                <div class="nav-links">
                    <a href="/" class="nav-link">Calculator</a>
                    <a href="/analytics" class="nav-link">Analytics</a>
                    <a href="/transcript" class="nav-link active">Transcript</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="hero">
            <h2>Transcript</h2>
        </div>

        <!-- Student Selection -->
        <div class="select-wrap">
            <select class="form-select" id="student-select">
                <option value="">Select a student...</option>
            </select>
        </div>

        <!-- Document -->
        <div id="transcript" style="display: none;">
            <div class="doc-header">
                <div class="doc-badge">Official Record</div>
                <div class="doc-title">Academic Transcript</div>
                <div class="doc-meta">
                    <span>Date: <span id="current-date"></span></span>
                    <span>ID: <span id="doc-id"></span></span>
                </div>
            </div>

            <div class="student-card">
                <div class="student-field">
                    <label>Student Name</label>
                    <div class="value" id="student-name">-</div>
                </div>
                <div class="student-field">
                    <label>Roll Number</label>
                    <div class="value" id="student-roll">-</div>
                </div>
            </div>

            <!-- Results -->
            <div id="results-container">
                <!-- Populated by JS -->
            </div>

            <!-- Summary -->
            <div class="summary-grid">
                <div class="summary-item">
                    <div class="summary-label">Cumulative GPA</div>
                    <div class="summary-value" id="final-cgpa">0.00</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Total Credits</div>
                    <div class="summary-value" id="final-credits">0</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Courses Passed</div>
                    <div class="summary-value" id="final-courses">0</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Classification</div>
                    <div class="summary-value" id="classification">-</div>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions">
            <button class="btn btn-primary" onclick="window.print()">🖨️ Print / PDF</button>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="footer-text">GradePoint • Academic Excellence Tracker</p>
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/calculator.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/transcript.js"></script>
</body>
</html>
