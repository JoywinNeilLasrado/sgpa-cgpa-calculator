<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GradePoint</title>
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        :root {
            --ink: #0d1117;
            --paper: #faf9f7;
            --crimson: #8b1538;
            --gold: #c9a227;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--paper) 0%, #e8e6e3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo h1 {
            color: var(--crimson);
            font-size: 2rem;
        }
        .logo p {
            color: #666;
            margin-top: 0.5rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #444;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--crimson);
        }
        .btn {
            width: 100%;
            padding: 1rem;
            background: var(--crimson);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #a5294d;
        }
        .btn:disabled {
            background: #999;
            cursor: not-allowed;
        }
        .error {
            background: #fee;
            color: #c00;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }
        .links {
            margin-top: 1.5rem;
            text-align: center;
        }
        .links a {
            color: var(--crimson);
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .nav-links {
            position: absolute;
            top: 1rem;
            right: 1rem;
        }
        .nav-links a {
            color: var(--crimson);
            text-decoration: none;
            margin-left: 1rem;
        }
    </style>
</head>
<body>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/home.html">Dashboard</a>
        <a href="/transcript.html">Transcript</a>
    </div>
    
    <div class="login-container">
        <div class="logo">
            <h1>GradePoint</h1>
            <p>Sign in to your account</p>
        </div>
        
        <div class="error" id="error"></div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter password">
            </div>
            
            <button type="submit" class="btn" id="submit-btn">Sign In</button>
        </form>
        
        <div class="links">
            <p>Demo accounts:</p>
            <p><small>admin / admin</small></p>
            <p><small>faculty / faculty</small></p>
            <p><small>alice / password123</small></p>
        </div>
    </div>
    
    <script>
        const API_BASE = '';
        
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submit-btn');
            const error = document.getElementById('error');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            error.style.display = 'none';
            
            try {
                const res = await fetch(API_BASE + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                if (!res.ok) {
                    throw new Error('Invalid credentials');
                }
                
                const data = await res.json();
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                // Redirect based on role
                if (data.user.role === 'ADMIN' || data.user.role === 'FACULTY') {
                    window.location.href = '/home.html';
                } else {
                    window.location.href = '/';
                }
            } catch (err) {
                error.textContent = err.message || 'Login failed';
                error.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });
        
        // Check if already logged in
        if (localStorage.getItem('token')) {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (user.role === 'ADMIN' || user.role === 'FACULTY') {
                window.location.href = '/home.html';
            }
        }
    </script>
</body>
</html>
