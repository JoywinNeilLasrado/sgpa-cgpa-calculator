<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/js/core.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GradePoint | Academic Excellence Tracker</title>
    
    
    <style>
        body.login-body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
            position: relative;
        }

        /* Ambient Crimson & Navy Mesh Background */
        body.login-body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 15% 20%, rgba(139, 21, 56, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(13, 17, 23, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(201, 162, 39, 0.05) 0%, transparent 50%),
                linear-gradient(135deg, #fbfaf8 0%, #e2ded7 100%);
            z-index: -1;
        }

        .login-wrapper {
            width: 100%;
            max-width: 480px;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-premium), 0 30px 60px rgba(139, 21, 56, 0.08);
            padding: 3.5rem 3rem;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .login-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--crimson) 0%, var(--gold) 50%, var(--crimson-dark) 100%);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-logo-icon {
            font-size: 2.8rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 68px;
            height: 68px;
            background: linear-gradient(135deg, var(--crimson) 0%, var(--crimson-dark) 100%);
            border-radius: var(--radius-md);
            box-shadow: 0 8px 24px rgba(139, 21, 56, 0.25);
            color: var(--white);
            margin-bottom: 1.25rem;
            animation: spinPulse 6s infinite linear;
        }

        @keyframes spinPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .login-logo h1 {
            font-size: 2.5rem;
            color: var(--crimson);
            margin-bottom: 0.3rem;
            font-weight: 700;
        }

        .login-logo p {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--slate-light);
            font-weight: 600;
        }

        .form-floating-group {
            position: relative;
            margin-bottom: 1.75rem;
        }

        .form-floating-input {
            width: 100%;
            padding: 1.1rem 1.2rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            color: var(--ink);
            background: rgba(250, 249, 247, 0.7);
            border: 1px solid var(--mist-dark);
            border-radius: var(--radius-md);
            outline: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .form-floating-input:focus {
            border-color: var(--crimson);
            background: var(--white);
            box-shadow: 0 0 0 4px var(--crimson-glow);
        }

        .form-floating-label {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--slate-light);
            font-size: 0.95rem;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            background: transparent;
        }

        /* Float labels on focus or content populated */
        .form-floating-input:focus ~ .form-floating-label,
        .form-floating-input:not(:placeholder-shown) ~ .form-floating-label {
            top: 0;
            transform: translateY(-50%) scale(0.85);
            padding: 0 0.4rem;
            background: var(--white);
            color: var(--crimson);
            font-weight: 600;
        }

        .demo-panel {
            margin-top: 2.5rem;
            border-top: 1px solid var(--mist);
            padding-top: 1.75rem;
        }

        .demo-panel-title {
            text-align: center;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--slate-light);
            margin-bottom: 1.25rem;
            font-weight: 600;
        }

        .demo-badge-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }

        .demo-pill-btn {
            background: rgba(245, 243, 239, 0.7);
            border: 1px solid rgba(203, 213, 225, 0.6);
            border-radius: var(--radius-md);
            padding: 0.75rem 0.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
        }

        .demo-pill-btn:hover {
            background: var(--white);
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(201, 162, 39, 0.12);
        }

        .demo-pill-role {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--crimson);
        }

        .demo-pill-user {
            font-size: 0.8rem;
            color: var(--slate);
        }

        /* Loading Overlay in Card */
        .card-loader {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .card-loader-spinner {
            border: 3px solid var(--mist);
            border-top: 3px solid var(--crimson);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        .card-loader-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--crimson);
        }

        /* Attempt counter badge */
        .attempt-tracker {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: var(--radius-sm);
            padding: 0.6rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: #92400e;
            gap: 0.5rem;
            animation: fadeIn 0.3s ease;
        }
        .attempt-tracker.show { display: flex; }
        .attempt-dots {
            display: flex;
            gap: 5px;
        }
        .attempt-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--mist-dark);
            transition: background 0.3s ease;
        }
        .attempt-dot.used { background: #f59e0b; }
        .attempt-dot.last { background: var(--crimson); }

        /* Lockout banner */
        .lockout-banner {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            background: rgba(139, 21, 56, 0.06);
            border: 1px solid rgba(139, 21, 56, 0.2);
            border-radius: var(--radius-sm);
            padding: 1rem 1.2rem;
            margin-bottom: 1rem;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }
        .lockout-banner.show { display: flex; }
        .lockout-icon { font-size: 1.8rem; }
        .lockout-title {
            font-weight: 700;
            color: var(--crimson);
            font-size: 0.9rem;
        }
        .lockout-timer {
            font-size: 1.5rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--crimson);
            letter-spacing: 0.05em;
        }
        .lockout-subtitle {
            font-size: 0.78rem;
            color: var(--slate-light);
        }
    </style>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="login-body">

    <div class="login-wrapper">
        <div class="login-card">
            
            <!-- Loader -->
            <div id="loader" class="card-loader">
                <div class="card-loader-spinner"></div>
                <div class="card-loader-text">Verifying Credentials...</div>
            </div>

            <div class="login-logo">
                <div class="login-logo-icon">🎓</div>
                <h1>GradePoint</h1>
                <p>Academic Excellence Tracker</p>
            </div>

            <!-- Error Alerts -->
            <div id="error-alert" class="alert alert-error"></div>

            <!-- Attempt tracker -->
            <div id="attempt-tracker" class="attempt-tracker">
                <div id="attempt-text" style="font-weight:600;"></div>
                <div class="attempt-dots" id="attempt-dots"></div>
            </div>

            <!-- Lockout countdown banner -->
            <div id="lockout-banner" class="lockout-banner">
                <div class="lockout-icon">🔒</div>
                <div class="lockout-title">Account Temporarily Locked</div>
                <div class="lockout-timer" id="lockout-timer">0:60</div>
                <div class="lockout-subtitle">Please wait before trying again</div>
            </div>

            <form id="login-form" autocomplete="off">
                <div class="form-floating-group">
                    <input type="text" id="username" name="username" class="form-floating-input" placeholder=" " required>
                    <label for="username" class="form-floating-label">Username</label>
                </div>

                <div class="form-floating-group">
                    <input type="password" id="password" name="password" class="form-floating-input" placeholder=" " required>
                    <label for="password" class="form-floating-label">Password</label>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1.1rem; margin-top: 0.5rem; font-size: 1rem;">
                    Sign In
                </button>
            </form>

            <div class="demo-panel">
                <div class="demo-panel-title">Demo Account Portals</div>
                <div class="demo-badge-grid">
                    <div class="demo-pill-btn" onclick="fillDemo('admin', 'admin')">
                        <div class="demo-pill-role">Admin</div>
                        <div class="demo-pill-user">admin / admin</div>
                    </div>
                    <div class="demo-pill-btn" onclick="fillDemo('faculty', 'faculty')">
                        <div class="demo-pill-role">Faculty</div>
                        <div class="demo-pill-user">faculty / faculty</div>
                    </div>
                    <div class="demo-pill-btn" onclick="fillDemo('alice', 'password123')">
                        <div class="demo-pill-role">Student</div>
                        <div class="demo-pill-user">alice / password123</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Toast Container -->
    

    <script type="module" src="/js/api-v2.js"></script>
    <script>
        function fillDemo(username, password) {
            const uInput = document.getElementById('username');
            const pInput = document.getElementById('password');
            uInput.value = username;
            pInput.value = password;
            uInput.dispatchEvent(new Event('input', { bubbles: true }));
            pInput.dispatchEvent(new Event('input', { bubbles: true }));
            uInput.classList.add('active');
            pInput.classList.add('active');
            if (window.showToast) window.showToast('Demo account credentials prefilled.', 'success');
        }

        // ── Rate limit UI state ──────────────────────────────────────────
        const MAX_ATTEMPTS = 5;
        let lockoutInterval = null;

        function renderAttemptDots(made) {
            const container = document.getElementById('attempt-dots');
            container.innerHTML = '';
            for (let i = 0; i < MAX_ATTEMPTS; i++) {
                const dot = document.createElement('div');
                dot.className = 'attempt-dot';
                if (i < made) dot.classList.add(i === made - 1 && made === MAX_ATTEMPTS - 1 ? 'last' : 'used');
                container.appendChild(dot);
            }
        }

        function showAttemptTracker(made, remaining) {
            const tracker = document.getElementById('attempt-tracker');
            const text = document.getElementById('attempt-text');
            tracker.classList.add('show');
            if (remaining === 0) {
                text.textContent = `Last attempt used — locking now`;
            } else {
                text.textContent = `${made} of ${MAX_ATTEMPTS} attempts · ${remaining} remaining`;
            }
            renderAttemptDots(made);
        }

        function startLockoutTimer(remainingMs) {
            const form     = document.getElementById('login-form');
            const banner   = document.getElementById('lockout-banner');
            const display  = document.getElementById('lockout-timer');
            const tracker  = document.getElementById('attempt-tracker');
            const submitBtn = form.querySelector('button[type="submit"]');

            tracker.classList.remove('show');
            banner.classList.add('show');
            submitBtn.disabled = true;

            if (lockoutInterval) clearInterval(lockoutInterval);

            const end = Date.now() + remainingMs;
            function tick() {
                const left = Math.max(0, end - Date.now());
                const secs = Math.ceil(left / 1000);
                const m = Math.floor(secs / 60);
                const s = secs % 60;
                display.textContent = `${m}:${String(s).padStart(2, '0')}`;
                if (left <= 0) {
                    clearInterval(lockoutInterval);
                    lockoutInterval = null;
                    banner.classList.remove('show');
                    submitBtn.disabled = false;
                    if (window.showToast) window.showToast('Account unlocked. You may try again.', 'info');
                }
            }
            tick();
            lockoutInterval = setInterval(tick, 500);
        }

        function clearRateLimitUI() {
            document.getElementById('attempt-tracker').classList.remove('show');
            document.getElementById('lockout-banner').classList.remove('show');
            if (lockoutInterval) { clearInterval(lockoutInterval); lockoutInterval = null; }
            document.querySelector('#login-form button[type="submit"]').disabled = false;
        }

        // ── Login form submit ────────────────────────────────────────────
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username    = document.getElementById('username').value.trim();
            const password    = document.getElementById('password').value;
            const errorAlert  = document.getElementById('error-alert');
            const loader      = document.getElementById('loader');

            errorAlert.classList.remove('show');
            loader.style.display = 'flex';

            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await resp.json();
                loader.style.display = 'none';

                if (resp.ok) {
                    // ✅ Success
                    clearRateLimitUI();
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data));
                    if (window.showToast) window.showToast(`Welcome back, ${data.username}!`, 'success');
                    setTimeout(() => {
                        if (data.role === 'ADMIN') window.location.href = '/admin.html';
                        else if (data.role === 'FACULTY') window.location.href = '/faculty-grades.html';
                        else window.location.href = '/student.html';
                    }, 800);

                } else if (resp.status === 429) {
                    // 🔒 Locked out
                    errorAlert.textContent = data.message || 'Account locked.';
                    errorAlert.classList.add('show');
                    startLockoutTimer(data.lockoutRemainingMs || 60000);
                    if (window.showToast) window.showToast('Account locked. Wait for timer.', 'error');

                } else {
                    // ❌ Wrong credentials
                    const made      = data.attemptsMade      ?? 1;
                    const remaining = data.attemptsRemaining ?? (MAX_ATTEMPTS - made);
                    const lockMs    = data.lockoutRemainingMs ?? 0;

                    errorAlert.textContent = data.message || 'Invalid credentials.';
                    errorAlert.classList.add('show');

                    if (lockMs > 0) {
                        startLockoutTimer(lockMs);
                    } else {
                        showAttemptTracker(made, remaining);
                    }
                    if (window.showToast) window.showToast('Authentication failed.', 'error');
                }
            } catch (err) {
                console.error(err);
                loader.style.display = 'none';
                errorAlert.textContent = 'Connection error. Please try again.';
                errorAlert.classList.add('show');
                if (window.showToast) window.showToast('Connection error.', 'error');
            }
        });
    </script>
</body>
</html>
