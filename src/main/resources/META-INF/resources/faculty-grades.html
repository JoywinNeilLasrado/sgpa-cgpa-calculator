<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Grade Management | GradePoint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        :root {
            --ink: #0d1117;
            --paper: #faf9f7;
            --parchment: #f5f3ef;
            --crimson: #8b1538;
            --crimson-light: #a5294d;
            --gold: #c9a227;
            --gold-light: #e4bc3a;
            --slate: #475569;
            --slate-light: #64748b;
            --mist: #e2e8f0;
            --white: #ffffff;
            --success: #10b981;
            --error: #ef4444;
            --shadow-soft: 0 4px 24px rgba(13, 17, 23, 0.08);
            --shadow-medium: 0 8px 40px rgba(13, 17, 23, 0.12);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--paper);
            color: var(--ink);
            line-height: 1.6;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(139, 21, 56, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(201, 162, 39, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        h1, h2, h3, h4 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        /* Navigation */
        .navbar {
            background: var(--white);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--mist);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-soft);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--crimson);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--ink);
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--crimson);
        }

        .btn-logout {
            background: var(--crimson);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            font-size: 0.9rem;
            transition: background 0.3s;
        }

        .btn-logout:hover {
            background: var(--crimson-light);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Cards */
        .card {
            background: var(--white);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: var(--shadow-soft);
            margin-bottom: 2rem;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--mist);
        }

        .card-title {
            font-size: 1.5rem;
            color: var(--ink);
            margin: 0;
        }

        .card-meta {
            color: var(--slate-light);
            font-size: 0.9rem;
        }

        /* Forms */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--ink);
        }

        .form-input, .form-select {
            padding: 0.75rem 1rem;
            border: 2px solid var(--mist);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--crimson);
            box-shadow: 0 0 0 3px rgba(139, 21, 56, 0.1);
        }

        /* Buttons */
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--crimson);
            color: white;
        }

        .btn-primary:hover {
            background: var(--crimson-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 21, 56, 0.3);
        }

        .btn-secondary {
            background: var(--mist);
            color: var(--ink);
        }

        .btn-secondary:hover {
            background: var(--slate-light);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }

        /* Tables */
        .table-responsive {
            overflow-x: auto;
            margin-top: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th {
            background: var(--parchment);
            color: var(--ink);
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid var(--mist);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--mist);
        }

        tr:hover {
            background: var(--parchment);
        }

        /* Alerts */
        .alert {
            padding: 1rem 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid var(--success);
        }

        .alert-error {
            background: #fee2e2;
            color: #7f1d1d;
            border-left: 4px solid var(--error);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 1rem;
            border-bottom: 2px solid var(--mist);
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 1rem;
            cursor: pointer;
            color: var(--slate);
            font-weight: 500;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--crimson);
            border-bottom-color: var(--crimson);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--slate-light);
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid var(--mist);
            border-top-color: var(--crimson);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hero {
            padding: 2rem 0;
            text-align: center;
            margin-bottom: 2rem;
        }

        .hero h2 {
            font-size: 2rem;
            color: var(--ink);
            margin-bottom: 0.5rem;
        }

        .hero p {
            color: var(--slate);
            font-size: 1rem;
        }

        .section-divider {
            height: 1px;
            background: var(--mist);
            margin: 2rem 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .stat-box {
            background: var(--parchment);
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--crimson);
        }

        .stat-label {
            color: var(--slate-light);
            margin-top: 0.5rem;
        }

        .action-cell {
            display: flex;
            gap: 0.5rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .badge-primary {
            background: rgba(139, 21, 56, 0.1);
            color: var(--crimson);
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <a href="/" class="nav-brand">GradePoint</a>
        <div class="nav-links">
            <a href="/index.html">Dashboard</a>
            <a href="/analytics.html">Analytics</a>
            <a href="/transcript.html">Transcript</a>
            <a href="/profile.html">Profile</a>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="hero">
            <h2>Faculty Grade Management</h2>
            <p>Enter and manage student grades by course or semester</p>
        </div>

        <div id="alert-container"></div>

        <!-- Tabs -->
        <div class="card">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('by-course')">By Course</button>
                <button class="tab-btn" onclick="switchTab('by-semester')">By Semester</button>
                <button class="tab-btn" onclick="switchTab('by-student')">By Student</button>
            </div>

            <!-- By Course Tab -->
            <div id="by-course" class="tab-content active">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Select Course</label>
                        <select class="form-select" id="course-select" onchange="loadEnrollmentsByCourse()">
                            <option value="">Choose a course...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">&nbsp;</label>
                        <button class="btn btn-primary" onclick="loadEnrollmentsByCourse()">Load Enrollments</button>
                    </div>
                </div>

                <div id="enrollments-by-course" class="table-responsive" style="display: none;">
                    <table>
                        <thead>
                            <tr>
                                <th>Student Name</th>
                                <th>Student ID</th>
                                <th>Current Grade</th>
                                <th>New Grade</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="course-enrollments-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- By Semester Tab -->
            <div id="by-semester" class="tab-content">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Select Semester</label>
                        <select class="form-select" id="semester-select" onchange="loadEnrollmentsBySemester()">
                            <option value="">Choose a semester...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">&nbsp;</label>
                        <button class="btn btn-primary" onclick="loadEnrollmentsBySemester()">Load Enrollments</button>
                    </div>
                </div>

                <div id="enrollments-by-semester" class="table-responsive" style="display: none;">
                    <table>
                        <thead>
                            <tr>
                                <th>Student</th>
                                <th>Course</th>
                                <th>Current Grade</th>
                                <th>New Grade</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="semester-enrollments-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- By Student Tab -->
            <div id="by-student" class="tab-content">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Select Student</label>
                        <select class="form-select" id="student-select" onchange="loadStudentEnrollments()">
                            <option value="">Choose a student...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">&nbsp;</label>
                        <button class="btn btn-primary" onclick="loadStudentEnrollments()">Load Enrollments</button>
                    </div>
                </div>

                <div id="enrollments-by-student" class="table-responsive" style="display: none;">
                    <table>
                        <thead>
                            <tr>
                                <th>Course</th>
                                <th>Semester</th>
                                <th>Current Grade</th>
                                <th>New Grade</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="student-enrollments-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let token = localStorage.getItem('token');

        if (!token) {
            window.location.href = '/login.html';
        }

        async function init() {
            await loadCourses();
            await loadSemesters();
            await loadStudents();
        }

        async function loadCourses() {
            try {
                const res = await fetch(API_BASE + '/faculty/courses', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error('Failed to load courses');
                const courses = await res.json();
                const select = document.getElementById('course-select');
                select.innerHTML = '<option value="">Choose a course...</option>' +
                    courses.map(c => `<option value="${c.id}">${c.code} - ${c.name}</option>`).join('');
            } catch (err) {
                showAlert('Error loading courses: ' + err.message, 'error');
            }
        }

        async function loadSemesters() {
            try {
                const res = await fetch(API_BASE + '/faculty/semesters', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error('Failed to load semesters');
                const semesters = await res.json();
                const select = document.getElementById('semester-select');
                select.innerHTML = '<option value="">Choose a semester...</option>' +
                    semesters.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
            } catch (err) {
                showAlert('Error loading semesters: ' + err.message, 'error');
            }
        }

        async function loadStudents() {
            try {
                const res = await fetch(API_BASE + '/students', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error('Failed to load students');
                const students = await res.json();
                const select = document.getElementById('student-select');
                select.innerHTML = '<option value="">Choose a student...</option>' +
                    students.map(s => `<option value="${s.id}">${s.name} (${s.studentId})</option>`).join('');
            } catch (err) {
                showAlert('Error loading students: ' + err.message, 'error');
            }
        }

        async function loadEnrollmentsByCourse() {
            const courseId = document.getElementById('course-select').value;
            if (!courseId) return;

            try {
                const res = await fetch(API_BASE + `/faculty/enrollments/course/${courseId}`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error('Failed to load enrollments');
                const enrollments = await res.json();
                
                const tbody = document.getElementById('course-enrollments-body');
                tbody.innerHTML = enrollments.map((e, idx) => `
                    <tr>
                        <td>${e.student?.name || 'N/A'}</td>
                        <td>${e.student?.studentId || 'N/A'}</td>
                        <td><span class="badge badge-primary">${e.grade || 'Not Graded'}</span></td>
                        <td>
                            <select class="form-select" id="grade-${idx}">
                                <option value="">Select...</option>
                                <option value="O">O</option>
                                <option value="A+">A+</option>
                                <option value="A">A</option>
                                <option value="B+">B+</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="P">P</option>
                                <option value="F">F</option>
                            </select>
                        </td>
                        <td>
                            <button class="btn btn-success btn-sm" onclick="updateGrade(${e.id}, ${idx})">Update</button>
                        </td>
                    </tr>
                `).join('');

                document.getElementById('enrollments-by-course').style.display = 'block';
            } catch (err) {
                showAlert('Error loading enrollments: ' + err.message, 'error');
            }
        }

        async function loadEnrollmentsBySemester() {
            const semesterId = document.getElementById('semester-select').value;
            if (!semesterId) return;

            try {
                const res = await fetch(API_BASE + `/faculty/enrollments/semester/${semesterId}`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error('Failed to load enrollments');
                const enrollments = await res.json();
                
                const tbody = document.getElementById('semester-enrollments-body');
                tbody.innerHTML = enrollments.map((e, idx) => `
                    <tr>
                        <td>${e.student?.name || 'N/A'}</td>
                        <td>${e.course?.code || 'N/A'}</td>
                        <td><span class="badge badge-primary">${e.grade || 'Not Graded'}</span></td>
                        <td>
                            <select class="form-select" id="grade-${idx}">
                                <option value="">Select...</option>
                                <option value="O">O</option>
                                <option value="A+">A+</option>
                                <option value="A">A</option>
                                <option value="B+">B+</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="P">P</option>
                                <option value="F">F</option>
                            </select>
                        </td>
                        <td>
                            <button class="btn btn-success btn-sm" onclick="updateGrade(${e.id}, ${idx})">Update</button>
                        </td>
                    </tr>
                `).join('');

                document.getElementById('enrollments-by-semester').style.display = 'block';
            } catch (err) {
                showAlert('Error loading enrollments: ' + err.message, 'error');
            }
        }

        async function loadStudentEnrollments() {
            const studentId = document.getElementById('student-select').value;
            if (!studentId) return;

            try {
                const res = await fetch(API_BASE + `/faculty/enrollments/student/${studentId}`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error('Failed to load enrollments');
                const enrollments = await res.json();
                
                const tbody = document.getElementById('student-enrollments-body');
                tbody.innerHTML = enrollments.map((e, idx) => `
                    <tr>
                        <td>${e.course?.code || 'N/A'}</td>
                        <td>${e.course?.semester?.name || 'N/A'}</td>
                        <td><span class="badge badge-primary">${e.grade || 'Not Graded'}</span></td>
                        <td>
                            <select class="form-select" id="grade-${idx}">
                                <option value="">Select...</option>
                                <option value="O">O</option>
                                <option value="A+">A+</option>
                                <option value="A">A</option>
                                <option value="B+">B+</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="P">P</option>
                                <option value="F">F</option>
                            </select>
                        </td>
                        <td>
                            <button class="btn btn-success btn-sm" onclick="updateGrade(${e.id}, ${idx})">Update</button>
                        </td>
                    </tr>
                `).join('');

                document.getElementById('enrollments-by-student').style.display = 'block';
            } catch (err) {
                showAlert('Error loading enrollments: ' + err.message, 'error');
            }
        }

        async function updateGrade(enrollmentId, rowIdx) {
            const gradeSelect = document.getElementById(`grade-${rowIdx}`);
            const newGrade = gradeSelect.value;

            if (!newGrade) {
                showAlert('Please select a grade', 'error');
                return;
            }

            try {
                const res = await fetch(API_BASE + '/faculty/grades', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ enrollmentId, grade: newGrade })
                });

                if (!res.ok) throw new Error('Failed to update grade');
                showAlert('Grade updated successfully', 'success');
                
                // Reload enrollments
                const activeTab = document.querySelector('.tab-btn.active').getAttribute('onclick');
                eval(activeTab.replace('switchTab(', 'loadEnrollmentsBy').replace(')', '()'));
            } catch (err) {
                showAlert('Error updating grade: ' + err.message, 'error');
            }
        }

        function switchTab(tabId) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            // Show selected tab
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alert);

            setTimeout(() => alert.remove(), 5000);
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        }

        init();
    </script>
</body>
</html>
