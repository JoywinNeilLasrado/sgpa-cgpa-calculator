<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGPA/CGPA Calculator | GradePoint</title>
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        :root {
            --ink: #0d1117;
            --paper: #faf9f7;
            --crimson: #8b1538;
            --gold: #c9a227;
            --mist: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
        }
        .navbar {
            background: white;
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--mist);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--crimson);
        }
        .nav-links a {
            color: var(--ink);
            text-decoration: none;
            margin-left: 1.5rem;
        }
        .nav-links a:hover {
            color: var(--crimson);
        }
        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom: 2rem;
        }
        h1 {
            color: var(--crimson);
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: #666;
            margin-bottom: 2rem;
        }
        .course-input {
            display: grid;
            grid-template-columns: 2fr 1fr 1.5fr auto;
            gap: 1rem;
            align-items: end;
            margin-bottom: 1rem;
            padding: 1rem;
            background: #f9f9f9;
            border-radius: 8px;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.625rem;
            border: 1px solid var(--mist);
            border-radius: 6px;
            font-size: 1rem;
        }
        .btn {
            padding: 0.625rem 1.25rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--crimson);
            color: white;
        }
        .btn-primary:hover {
            background: #a5294d;
        }
        .btn-secondary {
            background: var(--mist);
            color: var(--ink);
        }
        .result-box {
            background: linear-gradient(135deg, var(--crimson) 0%, #a5294d 100%);
            color: white;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            margin-top: 2rem;
        }
        .result-value {
            font-size: 3rem;
            font-weight: 700;
        }
        .result-label {
            opacity: 0.9;
        }
        .error {
            background: #fee;
            color: #c00;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
        }
        .hide { display: none; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">GradePoint</div>
        <div class="nav-links">
            <a href="/login.html">Login</a>
            <a href="/index.html">Dashboard</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="card">
            <h1>Calculate Your GPA</h1>
            <p class="subtitle">Enter your courses, credits, and grades to calculate SGPA or CGPA</p>
            
            <div style="margin-bottom: 1.5rem;">
                <button class="btn btn-secondary" onclick="showSGPA()">SGPA</button>
                <button class="btn btn-secondary" onclick="showCGPA()" style="margin-left: 0.5rem;">CGPA</button>
            </div>
            
            <div id="error" class="error hide"></div>
            
            <div id="courses-container">
                <!-- Dynamic course rows -->
            </div>
            
            <button class="btn btn-secondary" onclick="addCourse()" style="margin-top: 1rem;">+ Add Course</button>
            
            <button class="btn btn-primary" onclick="calculate()" style="margin-top: 1rem; width: 100%;">Calculate</button>
            
            <div class="result-box hide" id="result">
                <div class="result-value" id="result-value">0.00</div>
                <div class="result-label" id="result-label">SGPA</div>
            </div>
        </div>
        
        <div class="card">
            <h2>Grade Scale</h2>
            <table style="width: 100%; border-collapse: collapse; margin-top: 1rem;">
                <tr style="background: #f5f5f5;">
                    <th style="padding: 0.75rem; text-align: left;">Grade</th>
                    <th style="padding: 0.75rem; text-align: left;">Marks Range</th>
                    <th style="padding: 0.75rem; text-align: left;">Points</th>
                </tr>
                <tr><td style="padding: 0.5rem;"><strong>O</strong></td><td>90-100</td><td>10</td></tr>
                <tr><td style="padding: 0.5rem;"><strong>A+</strong></td><td>80-89</td><td>9</td></tr>
                <tr><td style="padding: 0.5rem;"><strong>A</strong></td><td>70-79</td><td>8</td></tr>
                <tr><td style="padding: 0.5rem;"><strong>B+</strong></td><td>60-69</td><td>7</td></tr>
                <tr><td style="padding: 0.5rem;"><strong>B</strong></td><td>55-59</td><td>6</td></tr>
                <tr><td style="padding: 0.5rem;"><strong>C</strong></td><td>50-54</td><td>5</td></tr>
                <tr><td style="padding: 0.5rem;"><strong>P</strong></td><td>40-49</td><td>4</td></tr>
                <tr><td style="padding: 0.5rem;"><strong>F</strong></td><td>00-39</td><td>0</td></tr>
            </table>
        </div>
    </div>
    
    <script>
        let currentMode = 'sgpa';
        let courseCount = 0;
        
        const GRADE_POINTS = {
            'O': 10, 'A+': 9, 'A': 8, 'B+': 7, 'B': 6, 'C': 5, 'P': 4, 'F': 0
        };
        
        function showSGPA() {
            currentMode = 'sgpa';
            document.getElementById('result-label').textContent = 'SGPA';
        }
        
        function showCGPA() {
            currentMode = 'cgpa';
            document.getElementById('result-label').textContent = 'CGPA';
        }
        
        function addCourse() {
            courseCount++;
            const div = document.createElement('div');
            div.className = 'course-input';
            div.id = 'course-' + courseCount;
            div.innerHTML = `
                <div class="form-group">
                    <label>Course Name</label>
                    <input type="text" placeholder="Course code/name">
                </div>
                <div class="form-group">
                    <label>Credits</label>
                    <input type="number" min="1" max="6" value="4">
                </div>
                <div class="form-group">
                    <label>Grade</label>
                    <select>
                        <option value="">Select...</option>
                        <option value="O">O (10)</option>
                        <option value="A+">A+ (9)</option>
                        <option value="A">A (8)</option>
                        <option value="B+">B+ (7)</option>
                        <option value="B">B (6)</option>
                        <option value="C">C (5)</option>
                        <option value="P">P (4)</option>
                        <option value="F">F (0)</option>
                    </select>
                </div>
                <button class="btn btn-secondary" onclick="removeCourse(${courseCount})">✕</button>
            `;
            document.getElementById('courses-container').appendChild(div);
        }
        
        function removeCourse(id) {
            document.getElementById('course-' + id).remove();
        }
        
        function calculate() {
            const courses = document.querySelectorAll('.course-input');
            let totalPoints = 0;
            let totalCredits = 0;
            
            courses.forEach(row => {
                const inputs = row.querySelectorAll('input, select');
                const credits = parseInt(inputs[1].value) || 0;
                const grade = inputs[2].value;
                const gradePoints = GRADE_POINTS[grade] || 0;
                
                if (credits > 0 && grade) {
                    totalCredits += credits;
                    totalPoints += credits * gradePoints;
                }
            });
            
            const error = document.getElementById('error');
            const resultBox = document.getElementById('result');
            const resultValue = document.getElementById('result-value');
            
            if (totalCredits === 0) {
                error.textContent = 'Please add at least one course with grade';
                error.classList.remove('hide');
                resultBox.classList.add('hide');
                return;
            }
            
            error.classList.add('hide');
            const gpa = (totalPoints / totalCredits).toFixed(2);
            resultValue.textContent = gpa;
            resultBox.classList.remove('hide');
        }
        
        // Add initial courses
        addCourse();
        addCourse();
        addCourse();
    </script>
</body>
</html>
