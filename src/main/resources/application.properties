# Application Configuration
spring.application.name=sgpa-cgpa-calculator

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:gradedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# H2 Console (for development/debugging)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Server Configuration
server.port=8080

# JWT Configuration
# Override this value in production with a 256-bit strong key (using environment variables)
jwt.secret=${JWT_SECRET:}

# Demo Seeding Configuration
# Set to false in staging/production to skip loading default students/courses/faculty
app.demo.seed=${APP_DEMO_SEED:true}
app.demo.password=${APP_DEMO_PASSWORD:}

# Error Handling Configuration
server.error.include-stacktrace=never
server.error.include-message=always

# Request size limits to prevent memory exhaustion / DoS
server.tomcat.max-http-form-post-size=2MB
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=10MB